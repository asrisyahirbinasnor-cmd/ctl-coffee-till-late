</head>
<body>

  <header>
	<button class="menu-button" onclick="toggleMenu()">&#9776;</button>
	<h1>CoffeeTillLate Cafe</h1>
	<nav id="mainNav">
	<nav>

   <main>
    <h2>Login</h2>
    <form onsubmit="return checkLogin()">
      <label for="loginEmail">Email</label>
      <input type="email" id="loginEmail" placeholder="example@email.com">

      <label for="loginPassword">Password</label>
      <input type="password" id="loginPassword" placeholder="At least 6 characters">

      <button type="submit">Login</button>
      <p id="loginResult"></p>
    </form>

    <h2>Register</h2>
    <form onsubmit="return checkRegister()">
      <label for="regName">Name</label>
      <input type="text" id="regName" placeholder="Your name">

      <label for="regEmail">Email</label>
      <input type="email" id="regEmail" placeholder="example@email.com">

      <label for="regPassword">Password</label>
      <input type="password" id="regPassword" placeholder="At least 6 characters">

      <label for="regConfirm">Confirm Password</label>
      <input type="password" id="regConfirm" placeholder="Type the password again">

      <button type="submit">Create Account</button>
      <p id="registerResult"></p>
    </form>
  </main>
